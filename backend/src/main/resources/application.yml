server:
  port: 8090
  forward-headers-strategy: framework

spring:
  jpa:
    open-in-view: false

usos:
  # USOS_MOCK=true replaces USOS with generated timetables, for local development without consumer keys
  mock: ${USOS_MOCK:false}
  base-url: ${USOS_BASE_URL:https://apps.usos.pw.edu.pl}
  consumer:
    key: ${CONSUMER_KEY:}
    secret: ${CONSUMER_SECRET:}

jwt:
  key: ${JWT_KEY}

app:
  url:
    backend: ${BACKEND_URL}
    frontend: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.url.frontend}}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
