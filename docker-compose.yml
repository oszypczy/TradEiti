# Local environment: http://localhost:8091 (frontend + /api proxy), API docs at http://localhost:8091/api/docs/ui
# Copy .env.example to .env first. With USOS_MOCK=true (default) no USOS keys are needed.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tradeiti
      POSTGRES_USER: ${POSTGRES_USER:-tradeiti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeiti}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8090" # direct access, e.g. for `npm run dev` with the Vite proxy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tradeiti
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tradeiti}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tradeiti}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # USOS redirects the browser back to BACKEND_URL, which is served through the frontend's nginx
      BACKEND_URL: ${PUBLIC_URL:-http://localhost:8091}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8091}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8091},http://localhost:5173
      USOS_MOCK: ${USOS_MOCK:-true}
      CONSUMER_KEY: ${CONSUMER_KEY:-}
      CONSUMER_SECRET: ${CONSUMER_SECRET:-}
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY in .env (openssl rand -base64 32)}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NGINX_CONF: nginx.local.conf
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8091:80"

volumes:
  db-data:
